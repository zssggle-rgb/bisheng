name: Tenant Context Quality

on:
  pull_request:
    paths:
      - 'src/backend/**'
      - 'integrations/forgemind/**'
      - 'src/frontend/packages/api-client/**'
      - '.github/workflows/tenant-context-quality.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Prepare isolated test configuration
        run: |
          echo "config=$RUNNER_TEMP/tenant-context-ci.yaml" >> "$GITHUB_ENV"
          printf '{}\n' > "$RUNNER_TEMP/tenant-context-ci.yaml"
      - name: Verify host controller
        run: uv run python -m unittest discover -s ../../integrations/forgemind
      - name: Verify actual routes, generated metadata and tenant boundaries
        run: >-
          uv run pytest -q
          test/forgemind/test_host_routes.py
          test/admin/test_request_scope_registry.py
          test/admin/test_request_scope_admission.py
          test/admin/test_request_scope_bootstrap.py
          test/admin/test_gateway_scope.py
          test/permission/test_management_target_boundary.py
          test/department/test_management_directory_scope.py
          test/tenant/test_context_preflight.py
          test/tenant/test_durable_task_scope.py
          test/workflow/test_variable_tenant_boundary.py
